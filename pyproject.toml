[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spaceqa-agent"
version = "0.1.0"
description = "Autonomous exploratory QA for browser games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "playwright>=1.49",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
spaceqa = "agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
